packages:
  - .
  - plugins/*

minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade

overrides:
  tmp: ">=0.2.6"
  # Security floors for transitive dependencies, each kept within the major
  # its parents already allow (pnpm update cannot move these on its own).
  "fast-uri@^3": "^3.1.9"
  "zod@^4": "^4.6.7"
  "brace-expansion@^5": "^5.0.11"
  "js-yaml@^3": "^3.15.2"
  "js-yaml@^4": "^4.3.2"
  "launch-editor@^2": "^2.14.2"
  "shell-quote@^1": "^1.11.0"
  "markdown-it@^14": "^14.3.3"
  "linkify-it@^5": "^5.0.2"
  "form-data@^4": "^4.0.6"
  "source-map-js@^1": "^1.2.2"

allowBuilds:
  # Native file-watcher pulled in by @tailwindcss/cli. Only needed for
  # --watch; the extension build is one-shot, so it stays unbuilt.
  '@parcel/watcher': false
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  node-llama-cpp: false

auditConfig:
  ignoreGhsas:
    # fast-uri host confusion (GHSA-58mr-gqgx-xq4g)
    - GHSA-58mr-gqgx-xq4g
    # Dev-only by construction: @vscode/vsce -> @azure/identity -> @azure/msal-node@5.2.2.
    # Absent from production runtime/shipped binary; re-check and remove when @vscode/vsce is upgraded.
    - GHSA-xcx6-jx8p-x3h5

ignoredBuiltDependencies:
  - protobufjs

# semver@5.7.2 (via @vscode/vsce -> parse-semver) is the 2023 ReDoS-fix
# release of the v5 line; it predates npm provenance while later-published
# 7.x releases have it, so the no-downgrade trust check flags it on fresh
# resolution. Already present in the committed lockfile - exact version only.
trustPolicyExclude:
  - semver@5.7.2

minimumReleaseAgeExclude:
  - brace-expansion@1.1.14
  - '@hono/node-server@1.19.14'
  - fast-uri@3.1.2
  - hono@4.12.18

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@vscode/vsce-sign'
  - esbuild
  - keytar

patchedDependencies:
  '@ai-sdk/openai@3.0.71': patches/@ai-sdk__openai@3.0.71.patch
  ink@6.8.0: patches/ink@6.8.0.patch
