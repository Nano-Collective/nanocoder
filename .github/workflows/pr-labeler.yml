name: PR path labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    # Skip the automated "Version Packages" PR.
    if: github.head_ref != 'changeset-release/main'
    steps:
      - name: Color area labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const labels = {
              'area:tools': ['1d76db', 'Tool implementations and tool-calling'],
              'area:tui': ['fbca04', 'Terminal UI'],
              'area:ci': ['d93f0b', 'GitHub Actions and CI'],
              'area:docs': ['0075ca', 'Documentation'],
              'area:vscode': ['5319e7', 'VS Code extension and host integration'],
            };
            const {owner, repo} = context.repo;
            for (const [name, [color, description]] of Object.entries(labels)) {
              try {
                await github.rest.issues.updateLabel({owner, repo, name, color, description});
              } catch {
                await github.rest.issues.createLabel({owner, repo, name, color, description});
              }
            }

      - name: Label by path
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
